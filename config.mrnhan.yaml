# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================
debug: false
pprof:
  enable: false
  addr: "127.0.0.1:8316"
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: true
redis-usage-queue-retention-seconds: 1800
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
disable-image-generation: true
commercial-mode: false

quota-exceeded:
  switch-project: false
  switch-preview-model: false
  antigravity-credits: false

# ==============================================================================
# ROUTING
# ==============================================================================
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "5h"
ws-auth: true
enable-gemini-cli-endpoint: false
nonstream-keepalive-interval: 0
streaming:
  keepalive-seconds: 20

# ==============================================================================
# POST-PAY BILLING
# ==============================================================================
post-pay-billing:
  enabled: true
  ledger-file: "finkrouter_ledger.json"

  clients:
    "fink_max_d41d8cd98f00b204e9800998ecf8427e":
      credit-limit: 20000
    "fink_pro_a7f3d2e8b1c4f9a0e5d6c3b2a1f0e9d8":
      credit-limit: 2000
    "fink_max_ad0234829205b9033196ba818f7a872b":
      credit-limit: 10000
    "fink_pro_5d41402abc4b2a76b9719d911017c592":
      credit-limit: 2000
    "fink_pro_e2fc714c4727ee9395f324cd2e7f331f":
      credit-limit: 2000
      
  markup-rates:
    "claude-opus-4-8":
      input: 280
      output: 560
      cache: 28
    "claude-opus-4-7":
      input: 280
      output: 560
      cache: 28
    "claude-opus-4-6":
      input: 280
      output: 560
      cache: 28
    "claude-sonnet-4-6":
      input: 210
      output: 420
      cache: 21
    "claude-haiku-4-5":
      input: 175
      output: 350
      cache: 17.5
    # Codex / OpenAI Models Markup Pricing
    "gpt-5.5":
      input: 300
      output: 600
      cache: 30
    "gpt-5.4":
      input: 250
      output: 500
      cache: 25
    "gpt-5.4-mini":
      input: 50
      output: 100
      cache: 5
    "gpt-5.3-codex":
      input: 200
      output: 400
      cache: 20
    "gpt-5.3-codex-spark":
      input: 150
      output: 300
      cache: 15
    "gpt-5.2":
      input: 100
      output: 200
      cache: 10

# ==============================================================================
# DEEPSEEK V4 FLASH — OPENAI-COMPATIBLE BACKEND
# All client-facing model names route to deepseek-v4-flash via DeepSeek API.
# ==============================================================================
openai-compatibility:
  - name: Anthropic
    priority: 1
    base-url: https://api.deepseek.com/v1
    api-key-entries:
      - api-key: sk-150d8ec5751b4a62a898265982bdc8ec
    # DeepSeek supports thinking/extended reasoning on v4-flash.
    models:
      - name: deepseek-v4-flash
        alias: claude-opus-4-8
      - name: deepseek-v4-flash
        alias: claude-opus-4-7
      - name: deepseek-v4-flash
        alias: claude-opus-4-6
      - name: deepseek-v4-flash
        alias: claude-sonnet-4-6
      - name: deepseek-v4-flash
        alias: claude-haiku-4-5
      - name: deepseek-v4-flash
        alias: gpt-5.5
      - name: deepseek-v4-flash
        alias: gpt-5.4
      - name: deepseek-v4-flash
        alias: gpt-5.4-mini
      - name: deepseek-v4-flash
        alias: gpt-5.3-codex
      - name: deepseek-v4-flash
        alias: gpt-5.3-codex-spark
      - name: deepseek-v4-flash
        alias: gpt-5.2
