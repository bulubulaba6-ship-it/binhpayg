      credit-limit: 0
  markup-rates:
    # DeepSeek-V4 Flash backend: upstream $0.14/$0.28/$0.0028 per 1M → 10x margin
    # cache = 10% of input (industry standard, Anthropic ratio)
    "claude-opus-4-8":
      input: 1400
      output: 2800
      cache: 140
    "claude-opus-4-7":
      input: 1400
      output: 2800
      cache: 140
    "claude-opus-4-6":
      input: 1400
      output: 2800
      cache: 140
    # Mimo-v2.5 backend: upstream ~$0.12/$0.40 per 1M → 10x margin
    "claude-sonnet-4-6":
      input: 1200
      output: 4000
      cache: 120
    "claude-haiku-4-5":
      input: 1000
      output: 3500
      cache: 100
    "claude-fable-5":
      input: 1200
      output: 4000
      cache: 120
    # GPT aliases → same backends as Claude
    "gpt-5.5":
      input: 1400
      output: 2800
      cache: 140
    "gpt-5.4":
      input: 1400
      output: 2800
      cache: 140
    "gpt-5.4-mini":
      input: 1000
      output: 3500
      cache: 100
    "gpt-5.3-codex-spark":
      input: 700
      output: 2100
      cache: 70

