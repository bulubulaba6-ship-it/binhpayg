# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================
debug: false
pprof:
  enable: false
  addr: "127.0.0.1:8316"
# On Render, stdout is streamed to the log dashboard — keep logging-to-file off.
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
# Enable usage stats so the quota dashboard charts work.
usage-statistics-enabled: true
# Keep 30 min of sessions in memory for RPM calculation (1800s).
redis-usage-queue-retention-seconds: 1800
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
# Retry on transient upstream errors (5xx / timeouts).
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
# Disable image generation (text-only backends).
disable-image-generation: true
commercial-mode: false

quota-exceeded:
  switch-project: false
  switch-preview-model: false
  antigravity-credits: false

# ==============================================================================
# ROUTING
# ==============================================================================
routing:
  strategy: "round-robin"
  # Enable session affinity so one user always hits the same backend key
  # (important for consistent context and billing accuracy).
  session-affinity: true
  session-affinity-ttl: "5h"
ws-auth: true
enable-gemini-cli-endpoint: false
# Send SSE keep-alive pings every 20s to prevent Render from closing long-poll
# connections during slow streaming responses.
nonstream-keepalive-interval: 0
streaming:
  keepalive-seconds: 20

# ==============================================================================
# POST-PAY BILLING
# ==============================================================================
post-pay-billing:
  enabled: true
  # NOTE: On Render free tier this file resets on sleep/restart (ephemeral FS).
  # For persistent billing, mount a disk (paid plan) or export to Postgres.
  ledger-file: "finkrouter_ledger.json"
  # webhook-secret: "your_deposit_webhook_secret_here"

  clients:
    "fink_max_d41d8cd98f00b204e9800998ecf8427e":
      # $20 hard cap. 20000 credits = $20.
      credit-limit: 20000
    "fink_pro_a7f3d2e8b1c4f9a0e5d6c3b2a1f0e9d8":
      credit-limit: 2000
    "fink_max_ad0234829205b9033196ba818f7a872b":
      credit-limit: 10000
    "fink_pro_5d41402abc4b2a76b9719d911017c592":
      credit-limit: 2000
    "fink_pro_e2fc714c4727ee9395f324cd2e7f331f":
      credit-limit: 2000

  markup-rates:
    # Fable 5 — premium tier, same as Opus pricing
    "claude-fable-5":
      input: 350
      output: 700
      cache: 35
    "claude-opus-4-8":
      input: 280
      output: 560
      cache: 28
    "claude-opus-4-7":
      input: 280
      output: 560
      cache: 28
    "claude-opus-4-6":
      input: 280
      output: 560
      cache: 28
    # claude-sonnet-4-6 served by mimo-v2.5
    "claude-sonnet-4-6":
      input: 210
      output: 420
      cache: 21
    # claude-haiku-4-5 served by mimo-v2.5
    "claude-haiku-4-5":
      input: 175
      output: 350
      cache: 17.5
    "gpt-5.5":
      input: 300
      output: 600
      cache: 30
    "gpt-5.4":
      input: 200
      output: 400
      cache: 20
    "gpt-5.4-mini":
      input: 150
      output: 300
      cache: 15
    "gpt-5.3-codex-spark":
      input: 150
      output: 300
      cache: 15

# ==============================================================================
# DEEPSEEK V4 FLASH — OPENAI-COMPATIBLE BACKEND (Opus / GPT-5.4/5.5 tier)
# Routes Opus, Fable, GPT-5.4, GPT-5.5 to deepseek-v4-flash via DeepSeek API.
# NOTE: gpt-5.4-mini and gpt-5.3-codex-spark moved to Mimo backend.
# ==============================================================================
openai-compatibility:
  - name: Anthropic
    priority: 1
    base-url: https://api.deepseek.com/v1
    api-key-entries:
      - api-key: sk-150d8ec5751b4a62a898265982bdc8ec
    # DeepSeek supports thinking/extended reasoning on v4-flash.
    models:
      - name: deepseek-v4-flash
        alias: claude-opus-4-8
      - name: deepseek-v4-flash
        alias: claude-opus-4-7
      - name: deepseek-v4-flash
        alias: claude-opus-4-6
      - name: deepseek-v4-flash
        alias: claude-fable-5
      - name: deepseek-v4-flash
        alias: gpt-5.5
      - name: deepseek-v4-flash
        alias: gpt-5.4

  # ==============================================================================
  # MIMO — OPENAI-COMPATIBLE BACKEND (Haiku / Sonnet / Mini / Spark tier)
  # All models use mimo-v2.5.
  # mimo-v2.5 → claude-haiku-4-5   (fast, cost-efficient)
  # mimo-v2.5 → claude-sonnet-4-6  (balanced, higher quality)
  # mimo-v2.5 → gpt-5.4-mini       (fast GPT tier)
  # mimo-v2.5 → gpt-5.3-codex-spark (ultra-fast coding)
  # ==============================================================================
  - name: Mimo
    priority: 2
    base-url: https://api.mimo.ai/v1
    api-key-entries:
      - api-key: sk-sapn4jzrh3sgwq6jd9bjt7zu8x45tpojkyzry2hb93hxxifu
    models:
      - name: mimo-v2.5
        alias: claude-haiku-4-5
      - name: mimo-v2.5
        alias: claude-sonnet-4-6
      - name: mimo-v2.5
        alias: gpt-5.4-mini
      - name: mimo-v2.5
        alias: gpt-5.3-codex-spark

default-api-key-limit: 2000
api-key-limits:
  # Post-pay clients — mirrors post-pay-billing.clients (REQUIRED for rate limiting)
  "fink_max_d41d8cd98f00b204e9800998ecf8427e": 10000 # Max 5x:    10,000 cr/5h
  "fink_pro_a7f3d2e8b1c4f9a0e5d6c3b2a1f0e9d8": 2000 # Pro:        2,000 cr/5h
